<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formation Événementiel — Accès Exclusif</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn-stripe { background-color: #635bff; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-stripe:hover { background-color: #4b45c6; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Masterclass : Réussir ses Événements Pro</h1>
        <p>Accédez à 2h de formation vidéo préenregistrée et aux supports de cours.</p>
        <h2>Prix : 49,00 €</h2>
        
        <button id="checkout-button" class="btn-stripe">Acheter la formation</button>
    </div>

    <script>
        // Initialiser Stripe avec ta Clé Publique (pk_live_... ou pk_test_...)
        const stripe = Stripe('pk_test_TYooMQauvdEDq54NiTphI7jx');

        const checkoutButton = document.getElementById('checkout-button');

        checkoutButton.addEventListener('click', () => {
            // Option A: Redirection vers un lien Stripe Payment Link (Recommandé - No-Code)
            // Tu créés le lien directement dans le tableau de bord Stripe Dashboard > Payment Links
            window.location.href = 'https://buy.stripe.com/votre_lien_de_paiement_custom';

            /* // Option B: Redirection via Checkout Session ID si tu utilises un backend léger
            stripe.redirectToCheckout({
                sessionId: 'cs_test_SESSION_ID_VENANT_DU_BACKEND'
            });
            */
        });
    </script>
</body>
</html>
