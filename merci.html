<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Confirmée — La Maison Ose & Brille</title>
    <style>
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: #fff8f9;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(128, 19, 54, 0.1);
            border: 1px solid #f3e5e8;
        }
        .icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }
        h1 {
            color: #801336;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        p {
            color: #5a5a5a;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #c59b27, #9e7917);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            border-radius: 30px;
            box-shadow: 0 4px 12px rgba(197, 155, 39, 0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">👑</div>
        <h1>Félicitations Queen !</h1>
        <p>Ta place pour le <strong>Queen Day</strong> est bien réservée.<br>Un e-mail de confirmation t'a été envoyé avec tous les détails de l'événement.</p>
        <a href="index.html" class="btn">Retour à l'accueil</a>
    </div>
</body>
</html>
